version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ubd-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubd-bot
    ports:
      - "8082:8082"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - REDIS_URL=redis://redis:6379/0
      - MAX_FILE_SIZE_MB=512
      - KEEP_ALIVE_ENABLED=true
      - KEEP_ALIVE_INTERVAL=300
      - RENDER=false
    volumes:
      - /tmp/ubd:/tmp/ubd
      - ${COOKIES_DIR:-~/.yt-dlp/cookies}:/home/botuser/.yt-dlp/cookies:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: